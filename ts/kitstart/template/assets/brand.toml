# The brand palette, in the kit's token vocabulary — the source of truth.
# `npm run palette` (the kit's `evinvest-palette`) writes app/brand.css from it
# and fails on a hole in either scope; the OG card reads [colors.dark] at build;
# the Figma modes mirror it. These are the kit's demo values: replace them.

wordmark = ["BRA", "ND"] # the second half takes primary

[colors.light]
background = "#ffffff"
card = "#f6f8fa"
muted = "#d2dbe6"
popover = "#ffffff"
ink = "#051726"
ink-soft = "#5a6b7c"
brand = "#0a2540"
primary = "#c2703d"
on-primary = "#051726"
primary-ink = "#9a5424"
secondary = "#edf1f5"
on-secondary = "#051726"
positive = "#1e9e6a"
on-positive = "#ffffff"
accent-trace = "#5a6b7c"
on-accent-trace = "#ffffff"
accent-debug = "#5a6b7c"
on-accent-debug = "#ffffff"
accent-info = "#5a6b7c"
on-accent-info = "#ffffff"
accent-warn = "#e08a3c"
on-accent-warn = "#051726"
accent-error = "#d8362a"
on-accent-error = "#ffffff"
chart-1 = "#9a5424"
chart-2 = "#1e9e6a"
chart-3 = "#e08a3c"
chart-4 = "#d8362a"
chart-5 = "#0a2540"

[colors.dark]
background = "#051726"
card = "#0a2540"
muted = "#12395c"
popover = "#12395c"
ink = "#ffffff"
ink-soft = "#a9bdd1"
brand = "#0a2540"
primary = "#c2703d"
on-primary = "#051726"
primary-ink = "#e08f5c"
secondary = "#12395c"
on-secondary = "#ffffff"
positive = "#1e9e6a"
on-positive = "#ffffff"
accent-trace = "#a9bdd1"
on-accent-trace = "#051726"
accent-debug = "#a9bdd1"
on-accent-debug = "#051726"
accent-info = "#a9bdd1"
on-accent-info = "#051726"
accent-warn = "#e08a3c"
on-accent-warn = "#051726"
accent-error = "#d8362a"
on-accent-error = "#ffffff"
chart-1 = "#e08f5c"
chart-2 = "#1e9e6a"
chart-3 = "#e08a3c"
chart-4 = "#d8362a"
chart-5 = "#a9bdd1"
