[package]
name = "ev_lib_gen"
version = "0.10.0"
edition = "2024"
description = "Generates the lib's TS (uikit class tables, shared registries) through ev_lib::ts_gen (Rust is the source of truth)."
license = "BlueOak-1.0.0"
repository = "https://github.com/EV-invest/lib"

[dependencies]
ev_lib = { workspace = true, features = ["analytics", "experiments", "i18n", "settings", "ts_gen", "types"] }
ev_lib_classes.workspace = true
serde_json.workspace = true
strum.workspace = true
tailwind_fuse = { workspace = true, features = ["variant"] }
