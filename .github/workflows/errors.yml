env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUSTC_WRAPPER: ''
  RUSTUP_MAX_RETRIES: '10'
  RUST_BACKTRACE: short
jobs:
  flake-app:
    name: nix run .#visual
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Lean cache setup
      run: 'mkdir -p /tmp/nix-lean-cache

        chmod 0777 /tmp/nix-lean-cache

        printf ''#!/bin/sh\nexport PATH=/nix/var/nix/profiles/default/bin:$PATH\nnix
        copy --to "file:///tmp/nix-lean-cache?compression=zstd&parallel-compression=true"
        $OUT_PATHS || true\n'' > /tmp/nix-lean-pbh.sh

        chmod 0755 /tmp/nix-lean-pbh.sh

        '
      shell: bash
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: 'lazy-trees = true

          post-build-hook = /tmp/nix-lean-pbh.sh

          extra-substituters = file:///tmp/nix-lean-cache

          extra-trusted-substituters = file:///tmp/nix-lean-cache

          require-sigs = false

          '
    - name: Lean nix cache (built-only paths)
      uses: actions/cache@v4
      with:
        key: nix-lean-${{ runner.os }}-${{ github.run_id }}
        path: /tmp/nix-lean-cache
        restore-keys: nix-lean-${{ runner.os }}-
    - name: Run visual
      run: nix run .#visual
  pre_ci:
    uses: valeratrades/.github/.github/workflows/pre_ci.yml@main
name: Errors
'on':
  pull_request: {}
  push: {}
  workflow_dispatch: {}
permissions:
  contents: read
