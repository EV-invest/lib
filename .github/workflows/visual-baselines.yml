# Hand-written (not generated by the v_flakes `github` module): renders the
# visual baselines on the same ubuntu image the `nix run .#visual` gate uses and
# publishes them as the `visual-snapshots` artifact, so a dev without a linux
# builder can refresh `rust/tests/visual/__screenshots__/` honestly:
#
#   gh run download <run-id> -n visual-snapshots -D rust/tests/visual/__screenshots__
#
# The gate in errors.yml stays the arbiter; this job only produces the PNGs.
name: Visual baselines
'on':
  pull_request:
    paths:
      - rust/**
      - tokens.css
      - motion.css
      - flake.nix
      - flake.lock
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  render:
    name: render baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      - name: Render
        run: nix run .#visual -- --update
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: rust/tests/visual/__screenshots__/*.png
          if-no-files-found: error
          retention-days: 14
