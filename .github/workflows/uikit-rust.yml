# Hand-written (not generated by the v_flakes `github` module, whose default
# job set is off here): the Rust side of the uikit — the class tables, the
# Dioxus components' tests, and the codegen that turns the one into the TS
# port's `generated/` modules. None of it ran in CI before, so a red test sat on
# main unseen (uikit::select, 3801a5d → #164) and a hand-edited or stale
# generated file would pass review.
name: uikit rust
'on':
  pull_request:
    paths:
      - rust/**
      - ts/uikit/src/generated/**
      - ts/i18n/src/generated/**
      - ts/types/src/generated/**
      - tokens.css
      - theme.css
      - ev.css
      - motion.css
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - .github/workflows/uikit-rust.yml
  push:
    branches: [main]
    paths:
      - rust/**
      - ts/uikit/src/generated/**
      - ts/i18n/src/generated/**
      - ts/types/src/generated/**
      - tokens.css
      - theme.css
      - ev.css
      - motion.css
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - .github/workflows/uikit-rust.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: classes, components, codegen drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      # RUSTC_WRAPPER is cleared as in kitstart.yml: the dev shell points it at
      # sccache, which has no cache to talk to on a runner.
      - name: ev_lib_classes
        run: nix develop --command env RUSTC_WRAPPER= cargo test -p ev_lib_classes
      - name: ev_lib uikit
        run: nix develop --command env RUSTC_WRAPPER= cargo test -p ev_lib --features uikit
      # The generated files are committed, so a change to their source that was
      # not regenerated (or an edit to the output by hand) shows up as a diff.
      # Scoped to what `gen` writes: entering the dev shell rewrites README.md
      # and friends, which is the flake's business, not this check's.
      - name: Codegen drift
        run: |
          nix run .#gen
          out="rust/classes/css rust/classes/uikit-classes.txt ts/uikit/src/generated ts/uikit/styles ts/i18n/src/generated ts/types/src/generated"
          drift="$(git status --porcelain -- $out)"
          if [ -n "$drift" ]; then
            echo "::error::generated files are stale — run \`nix run .#gen\` and commit the result"
            echo "$drift"
            git diff -- $out
            exit 1
          fi
