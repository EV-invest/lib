# Hand-written (not generated by the v_flakes `github` module, which only knows
# Rust jobs): the checks `ts/kitstart` promises before it may be published —
# types, the eslint layer boundaries, the tests (the shared fixtures in
# tests/fixtures/kitstart included), the build and the tarball's contents.
name: kitstart
'on':
  pull_request:
    paths:
      - ts/kitstart/**
      - ts/uikit/**
      - ts/marketing/**
      - tests/fixtures/kitstart/**
      - .github/workflows/kitstart.yml
  push:
    branches: [main]
    paths:
      - ts/kitstart/**
      - ts/uikit/**
      - ts/marketing/**
      - tests/fixtures/kitstart/**
      - .github/workflows/kitstart.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    name: typecheck, lint, test, build, pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/kitstart
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # `node:sqlite` without a flag needs >= 22.13 (the lead store).
          node-version: '22.14'
          cache: npm
          cache-dependency-path: |
            ts/kitstart/package-lock.json
            ts/uikit/package-lock.json
            ts/marketing/package-lock.json
      # The workspace packages kitstart develops against (`file:` devDependencies):
      # built here, because a linked directory ships whatever `dist/` it has.
      - name: Build the workspace packages it links
        run: |
          for pkg in uikit marketing; do
            (cd "../$pkg" && npm ci --ignore-scripts && npm run build)
          done
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify the tarball
        run: node scripts/verify-pack.mjs
