# Hand-written (not generated by the v_flakes `github` module, which only knows
# Rust jobs): the checks `ts/kitstart` promises before it may be published —
# types, the eslint layer boundaries, the tests (the shared fixtures in
# tests/fixtures/kitstart included), the build and the tarball's contents.
name: kitstart
'on':
  pull_request:
    paths:
      - ts/kitstart/**
      - ts/uikit/**
      - ts/marketing/**
      - tests/fixtures/kitstart/**
      - .github/workflows/kitstart.yml
      - flake.nix
      - flake.lock
  push:
    branches: [main]
    paths:
      - ts/kitstart/**
      - ts/uikit/**
      - ts/marketing/**
      - tests/fixtures/kitstart/**
      - .github/workflows/kitstart.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    name: typecheck, lint, test, build, pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/kitstart
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # `node:sqlite` without a flag needs >= 22.13 (the lead store).
          node-version: '22.14'
          cache: npm
          cache-dependency-path: |
            ts/kitstart/package-lock.json
            ts/uikit/package-lock.json
            ts/marketing/package-lock.json
      # The workspace packages kitstart develops against (`file:` devDependencies):
      # built here, because a linked directory ships whatever `dist/` it has.
      - name: Build the workspace packages it links
        run: |
          for pkg in uikit marketing; do
            (cd "../$pkg" && npm ci --ignore-scripts && npm run build)
          done
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify the tarball
        run: node scripts/verify-pack.mjs

  # `template/` built as a brand would — against the packed tarballs — through
  # `next build`, its own tests, the bundle budget and a live standalone
  # server: the only place the factories meet a real Next build.
  template:
    name: template (next build + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts/kitstart
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
          cache-dependency-path: |
            ts/kitstart/package-lock.json
            ts/uikit/package-lock.json
            ts/marketing/package-lock.json
      - name: Build the workspace packages it links and packs
        run: |
          for pkg in uikit marketing; do
            (cd "../$pkg" && npm ci --ignore-scripts && npm run build)
          done
      - name: Install
        run: npm ci
      - name: Build and smoke the template
        run: npm run check:template

  # Renders the widget gallery on the pinned linux stack, publishes the PNGs as
  # the `kitstart-visual` artifact (the only honest source of baselines — a mac
  # renders different glyphs), and fails when they differ from the committed
  # ones. To accept a change:
  #
  #   rm -f ts/kitstart/test/visual/__screenshots__/*.png
  #   gh run download <run-id> -n kitstart-visual -D ts/kitstart/test/visual/__screenshots__
  visual:
    name: nix run .#kitstart-visual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: 'lazy-trees = true'
      - name: Render and capture
        run: nix run .#kitstart-visual -- --update
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kitstart-visual
          path: ts/kitstart/test/visual/__screenshots__/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Compare with the committed baselines
        run: |
          changed="$(git status --porcelain -- ts/kitstart/test/visual/__screenshots__)"
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::widget baselines differ from this render — review the kitstart-visual artifact and commit it if intended"
            exit 1
          fi
